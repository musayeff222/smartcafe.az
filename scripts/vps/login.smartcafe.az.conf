# HTTP: login -> HTTPS; diger domainler (web menu) SPA
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/login.smartcafe.az/html;
    index index.html;

    location = /bb14fd2e01.js { return 204; }

    if ($host = login.smartcafe.az) {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
