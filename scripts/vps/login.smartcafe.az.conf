# SmartCafe POS (React build) — login + custom web menu domains
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name login.smartcafe.az;
    root /var/www/login.smartcafe.az/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/login.smartcafe.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/login.smartcafe.az/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /bb14fd2e01.js { return 204; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# HTTPS — custom web menu domain (akidosushi.az və s.)
server {
